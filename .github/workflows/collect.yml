name: Collect market data
on:
  schedule:
    - cron: '30 7 * * 1-5'   # 평일 16:30 KST (장 마감 후)
  workflow_dispatch:
    inputs:
      months:
        description: '실거래가를 거슬러 올라가 가져올 개월 수 (처음엔 24 권장)'
        default: '3'
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s collect
      # 한 수집기가 실패해도 다른 쪽 데이터는 저장되도록 따로 실행하고, 마지막에 실패 여부로 job을 실패 처리
      - name: Stocks (PER/PBR)
        id: market
        continue-on-error: true
        run: python collect/market.py
      - name: Apartments (실거래가)
        id: apt
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MONTHS: ${{ inputs.months || '3' }}
        run: python collect/apt.py --months "$MONTHS"
      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: market/realestate $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN 으로 푸시하면 다른 워크플로가 자동 실행되지 않으므로 Pages 배포를 직접 실행
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
      - name: Fail if a collector failed
        if: steps.market.outcome == 'failure' || steps.apt.outcome == 'failure'
        run: |
          echo "수집 실패: market=${{ steps.market.outcome }} apt=${{ steps.apt.outcome }}"
          exit 1
